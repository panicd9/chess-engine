[package]
name = "chess-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
colored = "2.0"
lazy_static = "1.5.0"
crossterm = "0.28.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "benchmarks"
harness = false

[profile.release]
debug = true
lto = "fat"
codegen-units = 1

[features]
# Hit/miss counting for the pawn hash. Off by default: the shipped engine
# must not pay a thread-local increment per probe for an instrument.
pawnstats = []

[[example]]
name = "pawnhitrate"
required-features = ["pawnstats"]
